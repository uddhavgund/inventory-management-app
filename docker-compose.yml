version: "3.9"

services:
  backend:
    build: ./backend
    container_name: inventory-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=default

  frontend:
    build: ./frontend
    container_name: inventory-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
